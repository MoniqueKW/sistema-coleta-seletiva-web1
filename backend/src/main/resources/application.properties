spring.application.name=siscoletaseletiva
spring.datasource.url=jdbc:postgresql://localhost:5432/coleta_seletiva
spring.datasource.username=${USUARIO:postgres}
spring.datasource.password=${SENHA}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=coleta_seletiva
spring.jpa.show-sql=true
spring.jackson.deserialization.read-unknown-enum-values-as-null=false
spring.jackson.deserialization.read-enums-using-to-string=true